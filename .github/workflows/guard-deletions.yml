name: Guard against media deletion
# Buffer drafts link to files in this repo for years.
# Any push that deletes a video/image gets those files restored automatically.
# To delete on purpose, put [allow-delete] in the commit message.
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore deleted media
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -e
          if git log --format=%B "$BEFORE..$AFTER" 2>/dev/null | grep -q '\[allow-delete\]'; then echo "deletion allowed"; exit 0; fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BEFORE=$(git rev-parse "$AFTER~1"); fi
          git diff --name-only -z --diff-filter=D "$BEFORE" "$AFTER" \
            | grep -z -i -E '\.(mp4|mov|webm|png|jpe?g|webp|gif)$' > /tmp/deleted || true
          COUNT=$(tr -cd '\0' < /tmp/deleted | wc -c)
          echo "deleted media: $COUNT"
          [ "$COUNT" -eq 0 ] && exit 0
          git config user.name "assets-guard"
          git config user.email "assets-guard@users.noreply.github.com"
          xargs -0 -a /tmp/deleted git checkout "$BEFORE" --
          git commit -m "Restore $COUNT deleted media files [guard]"
          git push origin HEAD:main
