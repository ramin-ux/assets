name: Guard against mass deletion
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore files if a push deleted many at once
        run: |
          git fetch --depth=2 origin main || true
          PREV=$(git rev-parse HEAD~1 2>/dev/null || true)
          [ -z "$PREV" ] && exit 0
          DELETED=$(git diff --name-only --diff-filter=D "$PREV" HEAD)
          COUNT=$(printf '%s\n' "$DELETED" | grep -c . || true)
          echo "deleted: $COUNT"
          if [ "$COUNT" -ge 10 ]; then
            git config user.name "assets-guard"
            git config user.email "assets-guard@users.noreply.github.com"
            printf '%s\n' "$DELETED" | while read -r f; do git checkout "$PREV" -- "$f"; done
            git commit -m "Restore $COUNT files deleted by $(git rev-parse --short HEAD) [guard]"
            git push origin HEAD:main
          fi
